services:
  - type: web
    name: cafeteria-api
    runtime: python
    plan: free
    rootDir: cafeteria/cafeteria-api
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/ensure_runtime_schema.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: CORS_ORIGINS
        value: https://cafeteria-web-zu30.onrender.com

  - type: web
    name: cafeteria-web
    runtime: python
    plan: free
    rootDir: cafeteria/cafeteria-web
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: SECRET_KEY
        generateValue: true
      - key: API_URL
        value: https://cafeteria-api-tqv4.onrender.com
