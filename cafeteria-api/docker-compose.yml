services:
  cafeteria-api:
    build: .
    image: cafeteria-api:latest
    container_name: cafeteria-api
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
